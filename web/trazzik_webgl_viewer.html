<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trazzik WebGL PBR Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1220;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-host {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }
    #walk-hud {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    #walk-hud.visible { display: flex; }
    .walk-btn {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .walk-btn:active { background: rgba(56, 189, 248, 0.35); }
    .walk-pad {
      display: flex;
      gap: 4px;
    }
    #status-pill {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 18px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 30;
    }
    #status-pill.hidden { opacity: 0; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
        "three/addons/environments/RoomEnvironment.js": "./vendor/three/RoomEnvironment.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-host"></div>
  <div id="status-pill">Iniciando motor WebGL PBR…</div>
  <div id="walk-hud">
    <span>Recorrido 1.65 m • WASD / Flechas + Arrastrar vista</span>
    <div class="walk-pad">
      <button class="walk-btn" data-move="forward">▲</button>
      <button class="walk-btn" data-move="back">▼</button>
      <button class="walk-btn" data-move="left">◀</button>
      <button class="walk-btn" data-move="right">▶</button>
    </div>
    <button class="walk-btn" id="walk-exit-btn">Salir (Esc)</button>
  </div>
  <script type="module" src="./trazzik_webgl_viewer.js"></script>
</body>
</html>
