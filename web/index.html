<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trazzik — Architectural 2D/3D CAD, remodeling budget planner, and interactive 3D viewer.">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trazzik">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trazzik — Estudio CAD 2D/3D</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #trazzik-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background-color: #0F172A;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #trazzik-loader .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: trazzik-spin 0.85s linear infinite;
    }
    #trazzik-loader .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00E5FF;
    }
    #trazzik-loader .hint {
      font-size: 12px;
      color: #94A3B8;
    }
    @keyframes trazzik-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="trazzik-loader" aria-label="Loading Trazzik">
    <div class="spinner"></div>
    <div class="brand">TRAZZIK</div>
    <div class="hint">Cargando motor CAD 2D / 3D…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('trazzik-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
